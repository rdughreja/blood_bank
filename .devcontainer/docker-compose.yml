services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/blood-bank:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg://bloodbank:bloodbank_dev@db:5432/bloodbank
      - REDIS_URL=redis://redis:6379/0
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bloodbank
      POSTGRES_PASSWORD: bloodbank_dev
      POSTGRES_DB: bloodbank
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodbank"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
volumes:
  postgres_data:
