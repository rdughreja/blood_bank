name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, mypy, pytest, pip-audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloodbank
          POSTGRES_PASSWORD: bloodbank_dev
          POSTGRES_DB: bloodbank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bloodbank:bloodbank_dev@localhost:5432/bloodbank_test
      SECRET_KEY: ci-test-secret-key-for-pytest-only
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TESTING: "true"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
      - name: Ruff (lint + format check)
        run: |
          ruff check app seed.py tests
          ruff format --check app seed.py tests
      - name: mypy --strict
        run: mypy --strict app seed.py
      - name: pytest (unit + API)
        run: python -m pytest -q
      - name: pip-audit
        run: pip-audit

  frontend:
    name: Frontend (generated client, type-check, build)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Regenerate API client from OpenAPI spec
        run: npm run generate:api
      - name: Check generated client is committed and current
        run: git diff --exit-code src/lib/api-generated/
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bloodbank
          POSTGRES_PASSWORD: bloodbank_dev
          POSTGRES_DB: bloodbank
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bloodbank:bloodbank_dev@localhost:5432/bloodbank
      SECRET_KEY: ci-test-secret-key-for-playwright-only
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Migrate and seed
        working-directory: apps/api
        run: |
          alembic upgrade head
          python seed.py
      - name: Start API and web servers
        run: |
          cd apps/api && nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          cd apps/web && nohup npm run start -- --port 3000 > /tmp/web.log 2>&1 &
          sleep 10
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:3000/login
      - name: Playwright E2E
        working-directory: apps/web
        run: npx playwright test
